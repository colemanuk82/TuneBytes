name: Build TuneBytes Desktop installer

on:
  workflow_dispatch:
  push:
    paths:
      - "main.pyw"
      - "ui.py"
      - "radio_engine.py"
      - "config.py"
      - "utils.py"
      - "requirements.txt"
      - "icon.ico"
      - "icon.png"
      - "logos/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build TuneBytes Desktop
        run: pyinstaller --noconfirm --clean packaging/windows/TuneBytes.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "packaging\windows\TuneBytes.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "dist-installer\TuneBytes-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "TuneBytes installer was not created"
          }
          Get-Item $installer | Format-List Name,Length,LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: TuneBytes-Windows-Installer
          path: dist-installer/TuneBytes-Setup.exe
          if-no-files-found: error
          retention-days: 90
